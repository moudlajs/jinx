[project]
name = "jinx-engine"
version = "0.0.0"
description = "Real-mode stats for jinx: random filters over nflverse data, kept only when the numbers are extreme."
requires-python = ">=3.12,<3.13"
dependencies = []

[project.scripts]
jinx = "jinx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jinx"]

[tool.uv]
# Only resolve releases at least two weeks old; bump this date in maintenance passes.
exclude-newer = "2026-09-26T00:00:00Z"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: downloads real nflverse data"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.9",
]
