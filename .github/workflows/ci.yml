# Typecheck, lint, unit tests, build and Playwright smoke on PRs and main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: web

jobs:
  # Engine jobs run only when engine/, schema/ or this workflow changed (always on main).
  changes:
    runs-on: ubuntu-latest
    outputs:
      engine: ${{ steps.diff.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        working-directory: .
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then echo "engine=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if git diff --name-only "$BASE...HEAD" | grep -qE '^(engine/|schema/|\.github/workflows/ci\.yml$)'; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
          else
            echo "engine=false" >> "$GITHUB_OUTPUT"
          fi

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  engine-lint:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          working-directory: engine
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check

  engine-test:
    needs: changes
    if: needs.changes.outputs.engine == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          working-directory: engine
      - run: uv sync --locked
      - run: uv run pytest

  # The one job the ruleset requires, so adding jobs never changes required checks.
  # Engine jobs may be skipped by the path filter; web jobs and the filter may not.
  check:
    if: always()
    needs: [changes, web, e2e, engine-lint, engine-test]
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs passed
        working-directory: .
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e '
            ([.[] | .result] | all(. != "failure" and . != "cancelled"))
            and .changes.result == "success" and .web.result == "success" and .e2e.result == "success"
            and (.changes.outputs.engine != "true"
                 or (."engine-lint".result == "success" and ."engine-test".result == "success"))'

  conventions:
    # The PR title becomes the squash commit subject that release-please reads.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: PR title follows Conventional Commits
        working-directory: .
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          echo "title: $TITLE"
          printf '%s' "$TITLE" | grep -qE '^(feat|fix|docs|test|ci|refactor|perf|chore|build|revert)(\([a-z0-9-]+\))?!?: .+' || {
            echo "PR title must be <type>(<scope>): <subject> - see CONTRIBUTING.md"; exit 1; }

      - name: Branch name follows the convention
        working-directory: .
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "branch: $BRANCH"
          printf '%s' "$BRANCH" | grep -qE '^((feat|fix|docs|test|ci|refactor|perf|chore|build)/[a-z0-9._/-]+|release-please--.+)$' || {
            echo "Branch must be <type>/<short-description>, lowercase - see CONTRIBUTING.md"; exit 1; }
