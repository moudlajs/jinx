<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;width:1200px;height:630px;background:#0b0f14;color:#ecf1f6;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;justify-content:center;padding:0 80px;box-sizing:border-box;}

.text{font-size:46px;font-weight:700;line-height:1.22;letter-spacing:-0.5px}

.tag{margin-top:28px;color:#a3b0bd;font-size:28px}
</style></head><body>
<div class="brand">jinx</div>
<div class="card"><div class="badge">SATIRE</div>

</body></html>
