<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jinx — cursed NFL stats</title>
    <meta name="color-scheme" content="dark light" />
    <script>
      try {
        const t = localStorage.getItem('jinx-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <meta name="description" content="Cursed NFL stats. A parody of broadcast-style insights. Satire: every number is made up." />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="jinx" />
    <meta property="og:title" content="jinx — cursed NFL stats" />
    <meta property="og:description" content="Stats that are technically insights and completely made up. Satire." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A jinx card labelled SATIRE: Kickers wearing #3 have missed 87% of field goals during a halftime show with fireworks on Thursdays." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div class="app">
      <div class="rail rail-left">
        <a class="brand" href="./">jinx</a>
        <figure class="quote" id="quote">
          <blockquote><p id="quote-text"></p></blockquote>
          <figcaption id="quote-author"></figcaption>
        </figure>
        <fieldset class="mode" id="mode">
          <legend class="visually-hidden" data-i18n="mode.label"></legend>
          <label>
            <input type="radio" name="mode" value="fake" checked />
            <span class="mode-option"><span class="mode-name" data-i18n="mode.fake"></span><span class="mode-desc" data-i18n="mode.fakeDesc"></span></span>
          </label>
          <label>
            <input type="radio" name="mode" value="real" />
            <span class="mode-option"><span class="mode-name" data-i18n="mode.real"></span><span class="mode-desc" data-i18n="mode.realDesc"></span></span>
          </label>
          <label>
            <input type="radio" name="mode" value="play" />
            <span class="mode-option"><span class="mode-name" data-i18n="mode.play"></span><span class="mode-desc" data-i18n="mode.playDesc"></span></span>
          </label>
        </fieldset>
        <footer class="site-footer">
          <p class="footer-long" data-i18n="footer.disclaimer"></p>
          <p class="footer-links">
            <span class="footer-short" data-i18n="footer.short"></span>
            <a class="footer-data" href="https://github.com/nflverse"><span class="footer-long" data-i18n="footer.data"></span><span class="footer-short" data-i18n="footer.shortData"></span></a>
            <a class="footer-source" href="https://github.com/moudlajs/jinx" data-i18n="footer.source"></a>
          </p>
        </footer>
      </div>

      <main class="stage" id="app">
        <div class="play-top" id="play-top" hidden>
          <fieldset class="games" id="games">
            <legend class="visually-hidden" data-i18n="play.gameLabel"></legend>
            <label><input type="radio" name="game" value="daily" /><span data-i18n="play.daily.name"></span></label>
            <label><input type="radio" name="game" value="guess" /><span data-i18n="play.guess.name"></span></label>
            <label><input type="radio" name="game" value="overunder" /><span data-i18n="play.ou.name"></span></label>
            <button type="button" class="games-back" id="games-back" data-i18n="play.menu.back"></button>
          </fieldset>
          <div class="progress" id="progress" aria-hidden="true"></div>
        </div>
        <div class="deck" id="deck">
          <span class="deck-under deck-under-1" aria-hidden="true"></span>
          <span class="deck-under deck-under-2" aria-hidden="true"></span>

          <section class="cover" id="hero">
            <div class="cover-face">
              <span class="cover-mark" aria-hidden="true">jinx</span>
              <p class="cover-line" data-i18n="hero.cover"></p>
              <button type="button" class="btn btn-primary" id="generate" data-i18n="hero.generate"></button>
              <p class="hint" data-i18n="hero.hint"></p>
            </div>
          </section>

          <section class="play-menu" id="play-menu" aria-labelledby="menu-title" hidden>
            <div class="cover-face menu-face">
              <h2 class="menu-title" id="menu-title" data-i18n="play.menu.title"></h2>
              <ul class="menu-list">
                <li>
                  <button type="button" class="menu-game" data-game="daily">
                    <span class="menu-name" data-i18n="play.daily.name"></span>
                    <span class="menu-desc" data-i18n="play.menu.dailyDesc"></span>
                    <span class="menu-status" id="menu-status-daily"></span>
                  </button>
                </li>
                <li>
                  <button type="button" class="menu-game" data-game="guess">
                    <span class="menu-name" data-i18n="play.guess.name"></span>
                    <span class="menu-desc" data-i18n="play.menu.guessDesc"></span>
                    <span class="menu-status" id="menu-status-guess"></span>
                  </button>
                </li>
                <li>
                  <button type="button" class="menu-game" data-game="overunder">
                    <span class="menu-name" data-i18n="play.ou.name"></span>
                    <span class="menu-desc" data-i18n="play.menu.ouDesc"></span>
                    <span class="menu-status" id="menu-status-overunder"></span>
                  </button>
                </li>
              </ul>
              <p class="end-note" data-i18n="play.menu.note"></p>
            </div>
          </section>

          <section class="daily-end" id="daily-end" aria-labelledby="end-kicker end-big" hidden>
            <div class="cover-face end-face">
              <p class="end-kicker" id="end-kicker"></p>
              <h2 class="end-big" id="end-big"></h2>
              <p class="end-text" id="end-text"></p>
              <div class="end-squares" id="end-squares" aria-hidden="true"></div>
              <div class="end-actions">
                <button type="button" class="btn btn-primary" id="end-share" data-i18n="play.daily.share"></button>
                <button type="button" class="btn" id="end-copy" data-i18n="card.copy"></button>
              </div>
              <p class="end-note" data-i18n="play.daily.tomorrow"></p>
              <button type="button" class="btn" id="end-guess" data-i18n="play.daily.toGuess"></button>
            </div>
          </section>

          <article class="card" id="card" hidden>
            <div class="card-turner">
              <section class="face face-front" id="card-front">
                <div class="face-inner">
                  <div class="card-top">
                    <p class="badge" id="card-badge">
                      <span id="card-badge-short"></span>
                      <span class="visually-hidden" id="card-badge-long"></span>
                    </p>
                    <span class="card-code" id="card-code"></span>
                  </div>
                  <p class="card-big" id="card-big" aria-hidden="true"></p>
                  <p class="card-big-label" id="card-big-label" aria-hidden="true"></p>
                  <p class="card-line" id="card-line" aria-live="polite" hidden></p>
                  <p class="stat-text" id="stat-text" aria-live="polite"></p>
                  <p class="stat-punchline" id="stat-punchline" hidden></p>
                  <div class="card-bottom">
                    <span class="card-meta" id="card-meta"></span>
                    <button type="button" class="btn btn-turn" id="turn" aria-controls="card-back">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 0 1 15.5-6.2L21 8" /><path d="M21 3v5h-5" /><path d="M21 12a9 9 0 0 1-15.5 6.2L3 16" /><path d="M3 21v-5h5" /></svg>
                      <span data-i18n="card.turn"></span>
                    </button>
                  </div>
                </div>
              </section>
              <section class="face face-back" id="card-back" aria-labelledby="back-title" inert>
                <div class="face-inner">
                  <div class="card-top">
                    <p class="badge" id="back-badge"></p>
                    <span class="card-code" id="back-code"></span>
                  </div>
                  <h2 class="back-title" id="back-title"></h2>
                  <div class="dots" id="back-dots" role="img"></div>
                  <p class="back-text" id="back-text"></p>
                  <ul class="chips" id="back-chips"></ul>
                  <div class="card-bottom">
                    <span class="back-source" id="back-source"></span>
                    <button type="button" class="btn btn-turn" id="turn-back" data-i18n="card.turnBack"></button>
                  </div>
                </div>
              </section>
            </div>
          </article>
        </div>
        <div class="actions" id="card-actions" hidden>
          <button type="button" class="btn btn-primary btn-deal" id="another" data-i18n="card.another"></button>
          <button type="button" class="btn" id="copy">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2" /><path d="M5 15V5a2 2 0 0 1 2-2h10" /></svg>
            <span class="btn-label" data-i18n="card.copy"></span>
          </button>
          <button type="button" class="btn" id="share" hidden>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v13M7 8l5-5 5 5" /><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" /></svg>
            <span class="btn-label" data-i18n="card.share"></span>
          </button>
        </div>
        <div class="game-actions" id="game-actions" hidden>
          <div class="answer" id="answer" role="group" aria-labelledby="answer-label">
            <span class="visually-hidden" id="answer-label" data-i18n="play.answerLabel"></span>
            <button type="button" class="btn btn-answer" id="answer-a"></button>
            <button type="button" class="btn btn-answer" id="answer-b"></button>
          </div>
          <div class="verdict-row" id="verdict-row" hidden>
            <p class="verdict" id="verdict" aria-live="polite"><strong id="verdict-title"></strong><span id="verdict-sub"></span></p>
            <button type="button" class="btn btn-primary btn-next" id="next-round"></button>
          </div>
          <p class="scoreline" id="scoreline"></p>
        </div>
        <p class="status" id="status" role="status"></p>
      </main>

      <div class="rail rail-right">
        <button type="button" class="theme-toggle" id="theme-toggle"></button>
        <section class="visit" aria-labelledby="visit-title">
          <h2 class="rail-title" id="visit-title" data-i18n="visit.title"></h2>
          <p class="visit-dealt"><span class="visit-count" id="visit-dealt">0</span> <span id="visit-dealt-label" data-i18n="visit.dealt"></span></p>
          <div class="visit-split">
            <p class="visit-split-labels"><span id="visit-fake"></span><span id="visit-real"></span></p>
            <div class="visit-bar" id="visit-bar" aria-hidden="true"><span class="visit-bar-fake"></span><span class="visit-bar-real"></span></div>
          </div>
          <div class="visit-wildest" id="visit-wildest" hidden>
            <h3 class="rail-title" data-i18n="visit.wildest"></h3>
            <div id="visit-wildest-card"></div>
          </div>
          <h3 class="rail-title" data-i18n="visit.last"></h3>
          <p class="visit-empty" id="visit-empty" data-i18n="visit.empty"></p>
          <ul class="visit-last" id="visit-last"></ul>
          <p class="visit-note" data-i18n="visit.note"></p>
        </section>
        <section class="score" id="score" aria-labelledby="score-title" hidden>
          <h2 class="rail-title" id="score-title"></h2>
          <p class="visit-dealt"><span class="visit-count" id="score-big"></span> <span id="score-big-label"></span></p>
          <p class="score-details" id="score-details"></p>
          <div class="score-dots" id="score-dots" aria-hidden="true"></div>
          <p class="visit-note" data-i18n="play.note"></p>
        </section>
      </div>

      <section class="ticker" id="ticker" aria-labelledby="ticker-label" hidden>
        <h2 class="ticker-label" id="ticker-label" data-i18n="ticker.label"></h2>
        <div class="ticker-window"><div class="ticker-track" id="ticker-track"></div></div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
