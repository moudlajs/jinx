<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jinx — cursed NFL stats</title>
    <meta name="color-scheme" content="dark light" />
    <script>
      try {
        const t = localStorage.getItem('jinx-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
    <meta name="description" content="Cursed NFL stats. A parody of broadcast-style insights. Satire: every number is made up." />
    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="%SITE_URL%" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="jinx" />
    <meta property="og:title" content="jinx — cursed NFL stats" />
    <meta property="og:description" content="Stats that are technically insights and completely made up. Satire." />
    <meta property="og:url" content="%SITE_URL%" />
    <meta property="og:image" content="%SITE_URL%og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A jinx card labelled SATIRE: Kickers wearing #3 have missed 87% of field goals during a halftime show with fireworks on Thursdays." />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="./">jinx</a>
      <span class="tagline" data-i18n="app.tagline"></span>
      <button type="button" class="theme-toggle" id="theme-toggle"></button>
    </header>

    <main id="app">
      <figure class="quote" id="quote">
        <blockquote><p id="quote-text"></p></blockquote>
        <figcaption id="quote-author"></figcaption>
      </figure>

      <fieldset class="mode" id="mode">
        <legend class="visually-hidden" data-i18n="mode.label"></legend>
        <label><input type="radio" name="mode" value="fejk" checked /><span data-i18n="mode.fejk"></span></label>
        <label><input type="radio" name="mode" value="real" /><span data-i18n="mode.real"></span></label>
      </fieldset>

      <div class="hero" id="hero">
        <button type="button" class="btn btn-primary" id="generate" data-i18n="hero.generate"></button>
        <p class="hint" data-i18n="hero.hint"></p>
      </div>

      <article class="card" id="card" hidden>
        <p class="badge" id="card-badge">
          <span id="card-badge-short"></span>
          <span class="visually-hidden" id="card-badge-long"></span>
        </p>
        <p class="stat-text" id="stat-text" aria-live="polite"></p>
        <p class="stat-punchline" id="stat-punchline" hidden></p>
        <details class="explain" id="explain" hidden>
          <summary data-i18n="explain.summary"></summary>
          <dl>
            <dt data-i18n="explain.metric"></dt>
            <dd id="explain-metric"></dd>
            <dt data-i18n="explain.filters"></dt>
            <dd><ul id="explain-filters"></ul></dd>
            <dt data-i18n="explain.sample"></dt>
            <dd id="explain-sample"></dd>
            <dt data-i18n="explain.seasons"></dt>
            <dd id="explain-seasons"></dd>
            <dt class="wide" data-i18n="explain.query"></dt>
            <dd class="wide"><pre><code id="explain-query"></code></pre></dd>
          </dl>
          <p class="explain-source"><a href="https://github.com/nflverse" data-i18n="explain.source"></a></p>
        </details>
        <div class="actions" id="card-actions">
          <button type="button" class="btn btn-primary" id="another" data-i18n="card.another"></button>
          <button type="button" class="btn" id="copy" data-i18n="card.copy"></button>
          <button type="button" class="btn" id="share" data-i18n="card.share" hidden></button>
        </div>
        <p class="status" id="status" role="status"></p>
      </article>
    </main>

    <footer class="site-footer">
      <p data-i18n="footer.disclaimer"></p>
      <p><a href="https://github.com/nflverse" data-i18n="footer.data"></a></p>
      <p><a href="https://github.com/moudlajs/jinx" data-i18n="footer.source"></a></p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
